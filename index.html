<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrador Directo Sin Contraseña</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #1a73e8;
            margin-top: 0;
            border-left: 4px solid #1a73e8;
            padding-left: 10px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #444;
        }
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 18px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
        }
        button:hover { background-color: #1557b0; }
        .output-box {
            background: #f8f9fa;
            border: 1px dashed #cbd5e1;
            padding: 12px;
            border-radius: 6px;
            margin-top: 8px;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            min-height: 40px;
            color: #334155;
        }
        .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 30px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cifrador Automático (Sin Contraseña)</h2>
    <p class="hint">Este sistema transforma el texto al instante en un formato cifrado legible pero oculto a simple vista, sin necesidad de recordar ninguna clave.</p>

    <!-- CIFRAR -->
    <label for="inputText">Mensaje original:</label>
    <textarea id="inputText" rows="3" placeholder="Escribe aquí tu mensaje..."></textarea>

    <button onclick="cifrarSinClave()">Cifrar Mensaje</button>

    <label>Texto cifrado resultante:</label>
    <div id="outputCifrado" class="output-box"></div>

    <hr>

    <!-- DESCIFRAR -->
    <h2>Descifrador Automático</h2>
    
    <label for="inputCiphertext">Pega aquí el texto cifrado:</label>
    <textarea id="inputCiphertext" rows="3" placeholder="Pega el mensaje cifrado aquí..."></textarea>

    <button onclick="descifrarSinClave()">Descifrar Mensaje</button>

    <label>Mensaje recuperado:</label>
    <div id="outputDescifrado" class="output-box" style="color: #16a34a; font-weight: bold;"></div>
</div>

<script>
    function cifrarSinClave() {
        let text = document.getElementById('inputText').value;
        if (!text) {
            alert("Escribe un texto.");
            return;
        }
        // Invertimos el texto y lo codificamos en Base64 para que parezca un código cifrado
        let reversed = text.split('').reverse().join('');
        let encoded = btoa(unescape(encodeURIComponent(reversed)));
        document.getElementById('outputCifrado').innerText = encoded;
    }

    function descifrarSinClave() {
        let input = document.getElementById('inputCiphertext').value.trim();
        if (!input) {
            alert("Pega un texto cifrado.");
            return;
        }
        try {
            // Decodificamos de Base64 y volvemos a invertir los caracteres al orden original
            let decodedBytes = decodeURIComponent(escape(atob(input)));
            let original = decodedBytes.split('').reverse().join('');
            document.getElementById('outputDescifrado').innerText = original;
        } catch (err) {
            document.getElementById('outputDescifrado').innerText = "Error: El texto no tiene un formato cifrado válido.";
        }
    }
</script>

</body>
</html>
